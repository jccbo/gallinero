<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuaderno del Gallinero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17261d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gallinero">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Layout: una columna tipo libreta de campo, barra de pestañas abajo para usarla con una mano en el patio. */
:root{
  --bg:#edf0e8; --surface:#fbfcf8; --ink:#17261d; --muted:#5b6a60; --line:#d3d9ca;
  --yolk:#e3a200; --yolk-ink:#2a1c00; --ok:#2d7a4d; --warn:#a96a0c; --bad:#b0402b; --shade:#e2e8da;
  --display:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1912; --surface:#172419; --ink:#e7efe4; --muted:#9bb0a0; --line:#2a3d2f;
    --yolk:#f0b429; --yolk-ink:#241700; --ok:#62c088; --warn:#e5ad4f; --bad:#ee7b65; --shade:#1e3023;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1912; --surface:#172419; --ink:#e7efe4; --muted:#9bb0a0; --line:#2a3d2f;
  --yolk:#f0b429; --yolk-ink:#241700; --ok:#62c088; --warn:#e5ad4f; --bad:#ee7b65; --shade:#1e3023;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
.app{max-width:600px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 8px}
h1{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:18px;margin:0 0 10px;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin-top:4px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:14px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.tile .k{font-size:13px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-weight:500;font-size:26px;line-height:1.15;margin-top:2px}
.tile.big{background:var(--yolk);border-color:var(--yolk);color:var(--yolk-ink)}
.tile.big .k{color:var(--yolk-ink);opacity:.8}
.tile .v small{font-size:13px;color:var(--muted);font-family:var(--body)}
.tile.big .v small{color:var(--yolk-ink)}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.yolk{background:var(--yolk);color:var(--yolk-ink);border-color:var(--yolk)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--yolk);outline-offset:2px}
.btn[disabled]{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-weight:600;border:0;background:transparent;color:var(--muted);padding:9px 16px;min-height:40px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.datebar .d{font-family:var(--display);font-weight:600;font-size:20px;text-align:center;flex:1}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label,.lab{font-size:13px;color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:76px;resize:vertical}
.chk{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink);min-height:44px}
.chk input{width:22px;height:22px;min-height:0}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:6px;align-items:stretch}
.stepper button{font:inherit;font-size:22px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-height:48px;cursor:pointer}
.stepper input{text-align:center;font-family:var(--mono);font-size:22px;min-height:48px}
.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.formgrid .full{grid-column:1/-1}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
.item:first-child{border-top:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.item .r{font-family:var(--mono);text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--shade);color:var(--muted);white-space:nowrap}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.alert{border-left:5px solid var(--muted);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:14px;border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.alert.warn{border-left-color:var(--warn)} .alert.bad{border-left-color:var(--bad)}
.banner{margin-top:12px;font-size:13px;color:var(--muted);background:var(--shade);border-radius:10px;padding:8px 12px}
.hint{font-size:12.5px;color:var(--muted)}
.empty{text-align:center;padding:22px 8px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--display);font-size:18px;margin-bottom:4px}
.thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--shade);flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
#tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
#tabs .in{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;width:100%;max-width:600px}
#tabs button{font:inherit;font-size:12.5px;font-weight:600;background:none;border:0;color:var(--muted);padding:10px 2px;border-radius:10px;min-height:48px;cursor:pointer}
#tabs button[aria-current="page"]{background:var(--ink);color:var(--bg)}
.scrim{position:fixed;inset:0;background:rgba(10,18,12,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:600px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:18px}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--mono);font-size:11px;fill:var(--muted)}
svg.chart .lbl{fill:var(--ink)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Cuaderno del gallinero</h1>
    <div class="sub" id="sub">Cargando tus registros…</div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav id="tabs" aria-label="Secciones"><div class="in" id="tabsin"></div></nav>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const diff=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmtD=(s,o)=>parse(s).toLocaleDateString('es-MX',o||{day:'numeric',month:'short'});
const money=n=>'$'+(+n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const num=(n,d)=>(n==null||isNaN(n))?'–':Number(n).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:d==null?1:d});
const pct=n=>n==null?'–':num(n*100,0)+' %';
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clean=o=>{const r={};Object.keys(o).forEach(k=>{if(o[k]!==undefined&&o[k]!==''&&o[k]!==null&&!(typeof o[k]==='number'&&isNaN(o[k])))r[k]=o[k]});return r};

/* ---------- catálogos ---------- */
const CATS_SALUD=['Vacuna','Desparasitante','Vitaminas o tratamiento','Veterinario','Limpieza del gallinero'];
const EVENTOS=['Muerte','Depredador','Cloquera','Muda','Enfermedad','Pelea','Nido escondido','Otro'];
const CATS_COMPRA=['Alimento','Calcio o conchuela','Cartones o conos','Medicina o vacuna','Equipo','Otro'];
const ESTADOS=[['activa','Activa'],['clueca','Clueca'],['muda','En muda'],['enferma','Enferma'],['muerta','Muerta'],['vendida','Vendida']];
const SALEN=['muerta','vendida'];
const MODOS=['Venta','Consumo propio','Regalo'];
const TABS=[['hoy','Hoy'],['gallinas','Gallinas'],['salud','Salud'],['ventas','Ventas'],['compras','Compras'],['resumen','Resumen']];

/* ---------- estado y almacenamiento ---------- */
const S={docs:new Map(),tab:'hoy',date:today(),per:{mode:'sem',anchor:today()},mode:'loading',loaded:false,slow:false,err:null,pending:false};
let coll=null;const chains=new Map();
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('gallinero',1);r.onupgradeneeded=()=>r.result.createObjectStore('docs');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function idbAll(db){return new Promise((res,rej)=>{const o=[],c=db.transaction('docs').objectStore('docs').openCursor();c.onsuccess=()=>{const k=c.result;if(k){o.push([k.key,k.value]);k.continue()}else res(o)};c.onerror=()=>rej(c.error)})}
function idbPut(id,v){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');t.objectStore('docs').put(v,id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function idbDel(id){return new Promise((res,rej)=>{const t=idb.transaction('docs','readwrite');t.objectStore('docs').delete(id);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
function write(id,data){data=clean(data);S.docs.set(id,data);idx=null;scheduleRender(true);return idbPut(id,data).catch(()=>toast('No se pudo guardar en el teléfono.'))}
function del(id){S.docs.delete(id);idx=null;scheduleRender(true);return idbDel(id).catch(()=>toast('No se pudo borrar.'))}
const recs=t=>[...S.docs].filter(e=>e[1].tipo===t).map(e=>Object.assign({},e[1],{id:e[0]}));
const byDateDesc=(a,b)=>(b.fecha||'').localeCompare(a.fecha||'')||b.id.localeCompare(a.id);
const dayRec=d=>S.docs.get('d-'+d);
const total=r=>(+r.m||0)+(+r.t||0);
const hens=()=>recs('gallina').filter(g=>g.sexo!=='Gallo');
const aliveOn=d=>hens().filter(g=>!g.salida||g.salida>d).length;
let idx=null;
function lotsOn(d){if(!idx){idx={};S.docs.forEach((x,id)=>{if(x.tipo==='recoleccion'){(idx[x.fecha]=idx[x.fecha]||[]).push(Object.assign({},x,{id:id}))}})}return idx[d]||[]}
function dayInfo(d){
  const r=dayRec(d),ls=lotsOn(d);
  const o={r:r,lots:ls,m:r?(+r.m||0):0,t:r?(+r.t||0):0,rot:r?(+r.rotos||0):0,fue:r?(+r.fuera||0):0};
  o.has=ls.length>0||!!(r&&(r.m!=null||r.t!=null));
  ls.forEach(x=>{if((x.hora||'12:00')<'12:00')o.m+=+x.huevos||0;else o.t+=+x.huevos||0;o.rot+=+x.rotos||0;o.fue+=+x.fuera||0});
  o.tot=o.m+o.t;return o;
}
const vida=()=>{const c=S.docs.get('cfg')||{};return {amb:+c.vidaAmb||14,ref:+c.vidaRef||28}};
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const tamano=p=>!p?'':p<53?'Chico':p<=63?'Mediano':'Grande';
function batches(){
  const v=vida(),out=[];
  S.docs.forEach((x,id)=>{
    if(x.tipo==='recoleccion'){const b=(+x.huevos||0)-(+x.rotos||0);if(b>0)out.push({id:id,fecha:x.fecha,hora:x.hora||'12:00',n:b,guardado:x.guardado||'ambiente',peso:x.peso,lugar:x.lugar,gallinaId:x.gallinaId,foto:x.foto})}
    else if(x.tipo==='dia'){const b=(+x.m||0)+(+x.t||0)-(+x.rotos||0);if(b>0)out.push({id:id,fecha:x.fecha,hora:'12:00',n:b,guardado:'ambiente',legacy:true})}
  });
  out.sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  let sold=sum(recs('salida'),s=>s.huevos);
  out.forEach(b=>{const take=Math.min(b.n,sold);b.rem=b.n-take;sold-=take;b.dias=b.guardado==='refrigerado'?v.ref:v.amb;b.vence=addDays(b.fecha,b.dias);b.left=diff(b.vence,today())});
  return out;
}
const thumb=s=>s?'<img class="thumb" alt="" src="'+esc(s)+'">':'';
function chipVence(left){const c=left<0?'bad':left<=3?'warn':'ok';const t=left<0?'pasó hace '+(-left)+' d':left===0?'vender hoy':'vender en '+left+' d';return '<span class="chip '+c+'">'+t+'</span>'}
const salTotal=x=>x.modo==='Venta'?(+x.huevos||0)/12*(+x.precio||0):0;

/* ---------- cálculos ---------- */
function stats(a,b){
  const o={days:diff(b,a)+1,rec:0,tot:0,rot:0,fue:0,ali:0,pSum:0,pN:0,sumV:0};
  for(let d=a;d<=b;d=addDays(d,1)){
    const di=dayInfo(d);if(di.r)o.ali+=+di.r.ali||0;if(!di.has)continue;
    o.rec++;o.tot+=di.tot;o.rot+=di.rot;o.fue+=di.fue;
    const v=aliveOn(d);o.sumV+=v;if(v>0){o.pSum+=di.tot/v;o.pN++}
  }
  const inR=x=>x.fecha>=a&&x.fecha<=b;
  const sal=recs('salida').filter(inR);
  o.buenos=o.tot-o.rot;
  const lp=recs('recoleccion').filter(inR).filter(x=>x.peso);o.peso=lp.length?sum(lp,x=>x.peso)/lp.length:null;
  o.vendidos=sum(sal.filter(x=>x.modo==='Venta'),x=>x.huevos);
  o.otros=sum(sal.filter(x=>x.modo!=='Venta'),x=>x.huevos);
  o.ventas=sum(sal,salTotal);
  o.cobrar=sum(sal.filter(x=>x.modo==='Venta'&&!x.pagado),salTotal);
  o.compras=sum(recs('compra').filter(inR),x=>x.costo);
  o.salud=sum(recs('sanidad').filter(inR),x=>x.costo);
  o.gastos=o.compras+o.salud;o.util=o.ventas-o.gastos;
  o.avgDia=o.rec?o.tot/o.rec:null;
  o.postura=o.pN?o.pSum/o.pN:null;
  o.costoHuevo=o.buenos>0?o.gastos/o.buenos:null;
  o.gHen=(o.ali>0&&o.sumV>0)?o.ali*1000/o.sumV:null;
  o.kgDocena=(o.ali>0&&o.buenos>0)?o.ali/(o.buenos/12):null;
  return o;
}
function stockHuevos(){return sum(batches(),b=>b.n)-sum(recs('salida'),x=>x.huevos)}
const racion=()=>{const c=S.docs.get('cfg')||{};return +c.kgDia>0?+c.kgDia:1};
function stockAli(){
  const comp=recs('compra').filter(c=>c.cat==='Alimento'&&+c.kg>0);
  if(!comp.length)return {kg:null,dias:null,fin:null};
  const k=racion(),t=today(),ini=comp.map(c=>c.fecha).sort()[0];
  let cons=0;
  for(let d=ini;d<=t;d=addDays(d,1)){const r=dayRec(d);if(r&&r.ali!=null)cons+=+r.ali;else if(d<t)cons+=k}
  const kg=sum(comp,c=>c.kg)-cons;
  return {kg:kg,dias:kg>0?kg/k:0,fin:kg>0?addDays(t,Math.floor(kg/k)):null};
}
function alerts(){
  const out=[],t=today();
  if(!dayInfo(t).has&&new Date().getHours()>=17)out.push({l:'',t:'Aún no registras los huevos de hoy.'});
  const last=[];for(let i=0;i<10;i++){const di=dayInfo(addDays(t,-i));if(di.has)last.push(di.tot)}
  if(last.length>=6){const av=a=>a.reduce((x,y)=>x+y,0)/a.length;const r3=av(last.slice(0,3)),pv=av(last.slice(3));
    if(pv>=2&&r3<pv*0.7)out.push({l:'warn',t:'La postura bajó '+Math.round((1-r3/pv)*100)+' % frente a los días anteriores. Revisa agua, alimento, muda, luz y depredadores.'})}
  const sa=stockAli();
  if(sa.kg!=null&&sa.kg<=0)out.push({l:'bad',t:'Según tus registros ya se acabó el alimento. Si compraste más, regístralo en Compras.'});else if(sa.dias!=null&&sa.dias<=5)out.push({l:sa.dias<=2?'bad':'warn',t:'Alimento para unos '+Math.floor(sa.dias)+' días.'});
  recs('sanidad').filter(x=>x.proxima&&!x.hecho).sort((a,b)=>a.proxima.localeCompare(b.proxima)).forEach(x=>{
    const n=diff(x.proxima,t),nm=(x.cat||'')+(x.producto?' · '+x.producto:'');
    if(n<0)out.push({l:'bad',t:'Vencido hace '+(-n)+' d: '+nm});else if(n<=7)out.push({l:'warn',t:(n===0?'Hoy toca: ':'En '+n+' d: ')+nm});
  });
  batches().filter(b=>b.rem>0&&b.left<=3).forEach(b=>out.push({l:b.left<0?'bad':'warn',t:b.rem+' huevos del '+fmtD(b.fecha)+(b.left<0?' ya pasaron su fecha de venta.':b.left===0?': hay que venderlos hoy.':' vencen en '+b.left+' d.')}));
  const por=sum(recs('salida').filter(x=>x.modo==='Venta'&&!x.pagado),salTotal);
  if(por>0)out.push({l:'',t:'Por cobrar: '+money(por)});
  return out;
}

/* ---------- render ---------- */
let rendering=false;
function scheduleRender(force){
  if(!force){const a=document.activeElement;if(a&&a.closest&&a.closest('#view')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){S.pending=true;return}}
  if(rendering)return;rendering=true;
  requestAnimationFrame(()=>{rendering=false;render()});
}

function tile(k,v,cls,small){return '<div class="tile '+(cls||'')+'"><div class="k">'+k+'</div><div class="v">'+v+(small?' <small>'+small+'</small>':'')+'</div></div>'}
function stepper(id,label,val){
  return '<div class="fld"><span class="lab">'+label+'</span><div class="stepper"><button type="button" data-act="step" data-t="'+id+'" data-n="-1" aria-label="Menos '+label+'">−</button><input id="'+id+'" type="number" inputmode="numeric" min="0" step="1" placeholder="0" value="'+(val==null?'':esc(val))+'" aria-label="'+label+'"><button type="button" data-act="step" data-t="'+id+'" data-n="1" aria-label="Más '+label+'">+</button></div></div>';

function chart(endDate){
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(endDate,-i));
  const vals=days.map(d=>{const di=dayInfo(d);return di.has?di.tot:null});
  const mx=Math.max(1,...vals.map(v=>v||0),aliveOn(endDate));
  const W=560,H=150,pl=4,pb=22,pt=18,bw=(W-pl*2)/14;
  let s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Huevos por día en los últimos 14 días">';
  s+='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" stroke="var(--line)"/>';
  days.forEach((d,i)=>{
    const x=pl+i*bw,v=vals[i],h=v==null?0:(H-pb-pt)*v/mx,isSel=d===endDate;
    if(v!=null){
      s+='<rect x="'+(x+5)+'" y="'+(H-pb-h)+'" width="'+(bw-10)+'" height="'+Math.max(h,1)+'" rx="3" fill="'+(isSel?'var(--yolk)':'var(--muted)')+'" opacity="'+(isSel?1:.55)+'"/>';
      s+='<text class="lbl" x="'+(x+bw/2)+'" y="'+(H-pb-h-4)+'" text-anchor="middle">'+v+'</text>';
    }else s+='<text x="'+(x+bw/2)+'" y="'+(H-pb-4)+'" text-anchor="middle">·</text>';
    s+='<text x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+parse(d).getDate()+'</text>';
  });
  return s+'</svg>';
}

function isoWeek(s){const d=parse(s);const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {w:Math.ceil(((t-y0)/864e5+1)/7),y:t.getUTCFullYear()}}

/* ---------- Excel ---------- */
const serial=s=>{const a=s.split('-').map(Number);return (Date.UTC(a[0],a[1]-1,a[2])-Date.UTC(1899,11,30))/864e5};
const DS=s=>s?{v:serial(s),z:'dd/mm/yyyy'}:'';
function cellOf(x){
  if(x==null||x==='')return null;
  if(typeof x==='object'){const c={t:typeof x.v==='number'?'n':'s',v:x.v==null?'':x.v};if(x.f)c.f=x.f;if(x.z)c.z=x.z;return c}
  if(typeof x==='number')return {t:'n',v:x};
  return {t:'s',v:String(x)};
}
function mkSheet(rows,widths){
  const ws={};let mc=0;
  rows.forEach((row,r)=>row.forEach((x,c)=>{const cell=cellOf(x);if(cell){ws[XLSX.utils.encode_cell({r:r,c:c})]=cell;if(c>mc)mc=c}}));
  ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(rows.length-1,0),c:Math.max(mc,widths.length-1)}});
  ws['!cols']=widths.map(w=>({wch:w}));return ws;
}
function buildWorkbook(R){
  const wb=XLSX.utils.book_new(),DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const st=stats(R.a,R.b),days=[];for(let d=R.a;d<=R.b;d=addDays(d,1))days.push(d);
  const inR=x=>x.fecha>=R.a&&x.fecha<=R.b;
  /* Diario */
  const dr=[['Fecha','Día','Mañana','Tarde','Total','Rotos','Buenos','Fuera del nido','Gallinas activas','% postura','Alimento (kg)','Luz (h)','Agua revisada','Notas']];
  days.forEach((d,i)=>{
    const di=dayInfo(d),r=di.r||{},x=i+2,v=aliveOn(d),has=di.has,t=has?di.tot:'';
    const bu=has?di.tot-di.rot:'';
    dr.push([DS(d),DOW[parse(d).getDay()],has?di.m:'',has?di.t:'',
      {f:'IF(COUNT(C'+x+':D'+x+')=0,"",SUM(C'+x+':D'+x+'))',v:has?t:''},
      has?di.rot:'',
      {f:'IF(E'+x+'="","",E'+x+'-N(F'+x+'))',v:bu},
      has?di.fue:'',v,
      {f:'IF(AND(E'+x+'<>"",I'+x+'>0),E'+x+'/I'+x+',"")',v:(has&&v>0)?t/v:'',z:'0.0%'},
      r.ali!=null?+r.ali:'',r.luz!=null?+r.luz:'',di.r?(r.agua?'Sí':'No'):'',r.notas||'']);
  });

async function saveFile(name,data,type){
  const blob=new Blob([data],{type:type});
  try{const f=new File([blob],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
async function exportXlsx(){
  if(!window.XLSX){toast('No cargó el generador de Excel. Recarga la página.');return}
  const R=range();let buf;

  await saveFile(R.file+'.xlsx',buf,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');toast('Excel listo');
}

function fieldHtml(f,val){
  const id='mf_'+f.k,lab='<label for="'+id+'">'+esc(f.label)+'</label>',cls='fld'+(f.full?' full':'');
  if(f.type==='foto')return '<div class="fld full"><span class="lab">'+esc(f.label)+'</span><div class="row"><img id="mf_foto_img" class="thumb" alt="" '+(val?'src="'+esc(val)+'"':'style="visibility:hidden"')+'><label class="btn sm" for="mf_foto">Tomar o elegir foto</label><input class="vh" id="mf_foto" type="file" accept="image/*"><button type="button" class="btn sm" data-act="fotoQuit">Quitar</button></div></div>';
  if(f.type==='check')return '<label class="chk full"><input type="checkbox" id="'+id+'"'+(val?' checked':'')+'> '+esc(f.label)+'</label>';
  if(f.type==='select')return '<div class="'+cls+'">'+lab+'<select id="'+id+'">'+f.opts.map(o=>{const a=Array.isArray(o)?o:[o,o];return '<option value="'+esc(a[0])+'"'+(String(val)===String(a[0])?' selected':'')+'>'+esc(a[1])+'</option>'}).join('')+'</select></div>';
  if(f.type==='area')return '<div class="'+cls+'">'+lab+'<textarea id="'+id+'">'+esc(val||'')+'</textarea></div>';

function gather(){
  const o={};formSpec.fields.forEach(f=>{
    if(f.type==='foto'){o[f.k]=formSpec.foto||undefined;return}
    const el=$('#mf_'+f.k);if(!el)return;
    if(f.type==='check')o[f.k]=el.checked;

    else o[f.k]=(el.value||'').trim();
  });return o;

    onSave:async x=>{await write('cfg',Object.assign({},S.docs.get('cfg')||{},{tipo:'cfg',vidaAmb:x.vidaAmb||14,vidaRef:x.vidaRef||28}))}});
}
function editDoc(id){
  const d=S.docs.get(id);if(!d)return;const x=Object.assign({},d,{id});
  ({gallina:formGallina,sanidad:formSalud,evento:formEvento,salida:formSalida,compra:formCompra,recoleccion:formReco})[d.tipo](x);
}

/* ---------- acciones ---------- */
let tt=null;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
async function saveDay(){
  const g=id=>{const e=$('#'+id);return e?e.value:''},n=id=>g(id)===''?undefined:Number(g(id));
  const old=S.docs.get('d-'+S.date)||{};
  await write('d-'+S.date,Object.assign({},old,{tipo:'dia',fecha:S.date,ali:n('f_ali'),luz:n('f_luz'),agua:$('#f_agua').checked,notas:g('f_notas').trim()}));
  toast('Día guardado');scheduleRender(true);
}
async function newHens(){
  for(let i=1;i<=10;i++)await write('g-'+uid()+i,{tipo:'gallina',nombre:'Gallina '+i,sexo:'Gallina',raza:'Rhode Island',estado:'activa'});
  await write('g-'+uid()+'x',{tipo:'gallina',nombre:'Gallo',sexo:'Gallo',raza:'Rhode Island',estado:'activa'});
  toast('Listo: 10 gallinas y 1 gallo');S.tab='gallinas';scheduleRender(true);
}
document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  if(a==='scrimclose'){if(ev.target===el)closeForm();return}
  if(a==='tab'){S.tab=el.dataset.k;scheduleRender(true);window.scrollTo(0,0)}
  else if(a==='day'){const n=+el.dataset.n;S.date=n===0?today():addDays(S.date,n);if(S.date>today())S.date=today();scheduleRender(true)}
  else if(a==='step'){const i=$('#'+el.dataset.t);i.value=Math.max(0,(+i.value||0)+(+el.dataset.n));}
  else if(a==='saveDay')saveDay();
  else if(a==='newHens')newHens();
  else if(a==='addGallina')formGallina();
  else if(a==='addSalud')formSalud();
  else if(a==='addEvento')formEvento();
  else if(a==='addSalida')formSalida();
  else if(a==='addCompra')formCompra();
  else if(a==='addReco')formReco();
  else if(a==='cfgVida')formVida();
  else if(a==='cfgRacion')formRacion();
  else if(a==='fotoQuit'){if(formSpec){formSpec.foto=undefined;const im=$('#mf_foto_img');if(im)im.style.visibility='hidden'}}
  else if(a==='editDoc')editDoc(el.dataset.id);
  else if(a==='doneSalud'){const d=S.docs.get(el.dataset.id);if(d){await write(el.dataset.id,Object.assign({},d,{hecho:true}));toast('Marcado como hecho')}}
  else if(a==='perMode'){S.per.mode=el.dataset.m;scheduleRender(true)}
  else if(a==='perNav'){const n=+el.dataset.n,p=S.per;if(p.mode==='sem')p.anchor=addDays(p.anchor,7*n);else{const d=parse(p.anchor);p.anchor=ymd(new Date(d.getFullYear(),d.getMonth()+n,1,12))}scheduleRender(true)}
  else if(a==='export')exportXlsx();
  else if(a==='backup')backup();
  else if(a==='mclose')closeForm();
  else if(a==='msave'){const v=gather();try{const ok=await formSpec.onSave(v);if(ok===false)return;closeForm();toast('Guardado');scheduleRender(true)}catch(e){toast('No se pudo guardar.')}}
  else if(a==='mdel'){if(el.dataset.sure){const f=formSpec;try{await f.onDelete();closeForm();toast('Borrado');scheduleRender(true)}catch(e){toast('No se pudo borrar.')}}else{el.dataset.sure='1';el.textContent='Confirmar borrado'}}
});
function readPhoto(file,max,q){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}
document.addEventListener('change',async e=>{
  if(e.target&&e.target.id==='restore'&&e.target.files&&e.target.files[0]){
    try{const arr=JSON.parse(await e.target.files[0].text());if(!Array.isArray(arr))throw 0;
      for(const it of arr){if(Array.isArray(it)&&typeof it[0]==='string'&&it[1]&&typeof it[1]==='object'){S.docs.set(it[0],it[1]);await idbPut(it[0],it[1])}}
      idx=null;scheduleRender(true);toast('Respaldo restaurado')}catch(err){toast('Ese archivo no es un respaldo válido.')}
    e.target.value='';return;
  }
  if(e.target&&e.target.id==='mf_foto'&&e.target.files&&e.target.files[0]&&formSpec){
    try{formSpec.foto=await readPhoto(e.target.files[0],640,0.55);const im=$('#mf_foto_img');im.src=formSpec.foto;im.style.visibility='visible'}catch(err){toast('No se pudo leer la foto.')}
  }
});
document.addEventListener('input',e=>{if(e.target.closest&&e.target.closest('#mform'))updateHint()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&formSpec)closeForm()});

/* ---------- arranque ---------- */
async function boot(){
  S.mode='local';render();
  try{idb=await idbOpen();S.docs=new Map(await idbAll(idb));idx=null}catch(e){S.err='sin almacenamiento'}
  S.loaded=true;scheduleRender(true);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
boot();
})();
</script>
</body>
